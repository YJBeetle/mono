name: RegistrationServices native Windows

on:
  push:
    branches: [codex/registration-services-windows-ci]

permissions:
  contents: read

jobs:
  compatibility:
    if: github.repository == 'YJBeetle/mono'
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /mcs/class/corlib/Test/System.Runtime.InteropServices/RegistrationServices*.cs
            /mcs/class/corlib/Makefile
            /mcs/class/mono.snk
            /scripts/ci/registration-services-windows*
      - name: Compile and run focused native compatibility tests
        shell: powershell
        run: ./scripts/ci/registration-services-windows.ps1 -Architecture '${{ matrix.architecture }}'
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registration-services-${{ matrix.architecture }}-${{ github.sha }}
          path: artifacts/registration-services-${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 30
